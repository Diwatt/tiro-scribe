# pnpm-workspace.yaml
# Workspace packages for pnpm.
# This tells pnpm which folders contain workspace packages.
# Matches the `workspaces` entry that used to live in package.json.
packages:
  - 'modules/*'

# Use hoisted node_modules layout to avoid duplicate native module instances.
# pnpm's isolated mode creates separate copies of react-native, expo, etc.
# in workspace member node_modules/, which causes Metro to resolve a
# duplicate react-native not wired to the native TurboModule registry.
nodeLinker: hoisted

# Allow build scripts for these dependencies (pnpm 11 syntax)
allowBuilds:
  esbuild: true
  msw: true
  "@nestjs/core": true
  "@parcel/watcher": true
  unrs-resolver: true
  react-native-executorch: true
  node-pty: true
  tree-sitter: true
  tree-sitter-javascript: true
  tree-sitter-typescript: true
  "@fails-components/webtransport-transport-http3-quiche": true

overrides:
  react: "19.3.1"
  react-dom: "19.3.1"

patchedDependencies:
  '@mikro-orm/core@7.2.7': patches/@mikro-orm__core@7.2.7.patch
  '@mikro-orm/sql@7.2.7': patches/@mikro-orm__sql@7.2.7.patch
  'react-native-blob-util@0.25.1': patches/react-native-blob-util@0.25.1.patch

minimumReleaseAgeExclude:
  - "@swmansion/argent@0.32.0"

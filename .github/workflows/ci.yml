name: CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'tests/**'
      - '__tests__/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - 'babel.config.js'
      - 'metro.config.js'
      - 'app.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'tests/**'
      - '__tests__/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - 'babel.config.js'
      - 'metro.config.js'
      - 'app.json'
      - '.github/workflows/ci.yml'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test
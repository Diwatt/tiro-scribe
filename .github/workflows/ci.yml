name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - '**.svg'
      - 'docs/**'
      - '.vscode/**'
      - '.cursor/**'
      - 'LICENCE'
      - '.editorconfig'
      - '.prettierrc.js'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - '**.svg'
      - 'docs/**'
      - '.vscode/**'
      - '.cursor/**'
      - 'LICENCE'
      - '.editorconfig'
      - '.prettierrc.js'

jobs:
  typescript-tests:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run TypeScript tests
        run: pnpm test:typescript

  kotlin-tests:
    name: Kotlin Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - uses: android-actions/setup-android@v3
      
      - uses: pnpm/action-setup@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
      
      - run: pnpm install --frozen-lockfile
      
      - name: Run Kotlin tests
        run: pnpm --filter secure-recorder test -- --platform android

  swift-tests:
    name: Swift Tests
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
      
      - run: pnpm install --frozen-lockfile
      
      - name: Run Swift tests
        run: pnpm --filter secure-recorder test -- --platform ios

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  typescript-tests:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run TypeScript tests
        run: pnpm test:typescript

  kotlin-tests:
    name: Kotlin Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      
      - name: Run prebuild to generate Android files
        run: CI=1 pnpm prebuild --platform android
      
      - name: Verify Android directory was created
        run: |
          if [ ! -d "android" ]; then
            echo "Error: android directory was not created by prebuild"
            exit 1
          fi
          echo "Android directory exists"
          ls -la android/
      
      - name: Make gradlew executable
        run: chmod +x android/gradlew
      
      - name: Run Kotlin tests
        run: pnpm test:kotlin

  swift-tests:
    name: Swift Tests
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Setup CocoaPods cache
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-
      
      - name: Run prebuild to generate iOS files
        run: CI=1 pnpm prebuild --platform ios
      
      - name: Verify iOS directory was created
        run: |
          if [ ! -d "ios" ]; then
            echo "Error: ios directory was not created by prebuild"
            exit 1
          fi
          echo "iOS directory exists"
          ls -la ios/
      
      - name: Install CocoaPods dependencies
        run: cd ios && pod install
      
      - name: Verify workspace was created
        run: |
          if [ ! -f "ios/TiroScribe.xcworkspace/contents.xcworkspacedata" ]; then
            echo "Error: Xcode workspace was not created by pod install"
            exit 1
          fi
          echo "Workspace exists"
      
      - name: Run Swift tests
        run: pnpm test:swift

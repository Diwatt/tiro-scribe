name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - '**.svg'
      - 'docs/**'
      - '.vscode/**'
      - '.cursor/**'
      - 'LICENCE'
      - '.editorconfig'
      - '.prettierrc.js'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - '**.svg'
      - 'docs/**'
      - '.vscode/**'
      - '.cursor/**'
      - 'LICENCE'
      - '.editorconfig'
      - '.prettierrc.js'

jobs:
  typescript-tests:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run TypeScript tests
        run: pnpm test:typescript

  kotlin-tests:
    name: Kotlin Tests (Expo Module)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check if Kotlin tests exist
        id: check-tests
        run: |
          if find modules/*/android/src/test -name "*.kt" 2>/dev/null | grep -q .; then
            echo "tests_exist=true" >> $GITHUB_OUTPUT
          else
            echo "tests_exist=false" >> $GITHUB_OUTPUT
            echo "No Kotlin tests found, skipping job"
          fi
      
      - name: Setup JDK
        if: steps.check-tests.outputs.tests_exist == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        if: steps.check-tests.outputs.tests_exist == 'true'
        uses: android-actions/setup-android@v3
      
      - name: Setup pnpm
        if: steps.check-tests.outputs.tests_exist == 'true'
        uses: pnpm/action-setup@v4
      
      - name: Setup Node.js
        if: steps.check-tests.outputs.tests_exist == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
      
      - name: Install root dependencies
        if: steps.check-tests.outputs.tests_exist == 'true'
        run: pnpm install --frozen-lockfile
      
      - name: Install module dependencies
        if: steps.check-tests.outputs.tests_exist == 'true'
        working-directory: modules/secure-recorder
        run: pnpm install --frozen-lockfile
      
      - name: Run Kotlin tests via expo-module
        if: steps.check-tests.outputs.tests_exist == 'true'
        working-directory: modules/secure-recorder
        run: pnpm test -- --platform android

  swift-tests:
    name: Swift Tests (Expo Module)
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check if Swift tests exist
        id: check-tests
        run: |
          if find modules/*/ios/Tests -name "*.swift" 2>/dev/null | grep -q .; then
            echo "tests_exist=true" >> $GITHUB_OUTPUT
          else
            echo "tests_exist=false" >> $GITHUB_OUTPUT
            echo "No Swift tests found, skipping job"
          fi
      
      - name: Setup pnpm
        if: steps.check-tests.outputs.tests_exist == 'true'
        uses: pnpm/action-setup@v4
      
      - name: Setup Node.js
        if: steps.check-tests.outputs.tests_exist == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
      
      - name: Install root dependencies
        if: steps.check-tests.outputs.tests_exist == 'true'
        run: pnpm install --frozen-lockfile
      
      - name: Install module dependencies
        if: steps.check-tests.outputs.tests_exist == 'true'
        working-directory: modules/secure-recorder
        run: pnpm install --frozen-lockfile
      
      - name: Run Swift tests via expo-module
        if: steps.check-tests.outputs.tests_exist == 'true'
        working-directory: modules/secure-recorder
        run: pnpm test -- --platform ios

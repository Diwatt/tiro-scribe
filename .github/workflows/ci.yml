name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  typescript-tests:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run TypeScript tests
        run: pnpm test:typescript

  kotlin-tests:
    name: Kotlin Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check if Kotlin tests exist
        id: check-tests
        run: |
          if find modules/*/android/src/test -name "*.kt" 2>/dev/null | grep -q .; then
            echo "tests_exist=true" >> $GITHUB_OUTPUT
          else
            echo "tests_exist=false" >> $GITHUB_OUTPUT
            echo "No Kotlin tests found, skipping job"
          fi
      
      - name: Setup JDK
        if: steps.check-tests.outputs.tests_exist == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        if: steps.check-tests.outputs.tests_exist == 'true'
        uses: android-actions/setup-android@v3
      
      - name: Setup pnpm
        if: steps.check-tests.outputs.tests_exist == 'true'
        uses: pnpm/action-setup@v4
      
      - name: Setup Node.js
        if: steps.check-tests.outputs.tests_exist == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
      
      - name: Install dependencies
        if: steps.check-tests.outputs.tests_exist == 'true'
        run: pnpm install --frozen-lockfile
      
      - name: Setup Gradle cache
        if: steps.check-tests.outputs.tests_exist == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      
      - name: Run prebuild to generate Android files
        if: steps.check-tests.outputs.tests_exist == 'true'
        run: CI=1 pnpm prebuild --platform android
      
      - name: Verify Android directory was created
        if: steps.check-tests.outputs.tests_exist == 'true'
        run: |
          if [ ! -d "android" ]; then
            echo "Error: android directory was not created by prebuild"
            exit 1
          fi
          echo "Android directory exists"
          ls -la android/
      
      - name: Make gradlew executable
        if: steps.check-tests.outputs.tests_exist == 'true'
        run: chmod +x android/gradlew
      
      - name: Run Kotlin tests
        if: steps.check-tests.outputs.tests_exist == 'true'
        run: pnpm test:kotlin

  swift-tests:
    name: Swift Tests
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check if Swift tests exist
        id: check-tests
        run: |
          if find modules/*/ios/Tests -name "*.swift" 2>/dev/null | grep -q .; then
            echo "tests_exist=true" >> $GITHUB_OUTPUT
          else
            echo "tests_exist=false" >> $GITHUB_OUTPUT
            echo "No Swift tests found, skipping job"
          fi
      
      - name: Setup pnpm
        if: steps.check-tests.outputs.tests_exist == 'true'
        uses: pnpm/action-setup@v4
      
      - name: Setup Node.js
        if: steps.check-tests.outputs.tests_exist == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
      
      - name: Install dependencies
        if: steps.check-tests.outputs.tests_exist == 'true'
        run: pnpm install --frozen-lockfile
      
      - name: Setup CocoaPods cache
        if: steps.check-tests.outputs.tests_exist == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-
      
      - name: Run prebuild to generate iOS files
        if: steps.check-tests.outputs.tests_exist == 'true'
        run: CI=1 pnpm prebuild --platform ios
      
      - name: Verify iOS directory was created
        if: steps.check-tests.outputs.tests_exist == 'true'
        run: |
          if [ ! -d "ios" ]; then
            echo "Error: ios directory was not created by prebuild"
            exit 1
          fi
          echo "iOS directory exists"
          ls -la ios/
      
      - name: Install CocoaPods dependencies
        if: steps.check-tests.outputs.tests_exist == 'true'
        run: cd ios && pod install
      
      - name: Verify workspace was created
        if: steps.check-tests.outputs.tests_exist == 'true'
        run: |
          if [ ! -f "ios/TiroScribe.xcworkspace/contents.xcworkspacedata" ]; then
            echo "Error: Xcode workspace was not created by pod install"
            exit 1
          fi
          echo "Workspace exists"
      
      - name: Run Swift tests
        if: steps.check-tests.outputs.tests_exist == 'true'
        run: |
          # List only iPhones (fast, filtered)
          SIMULATOR=$(xcrun simctl list devices iPhone available 2>/dev/null | grep -E "iPhone [0-9]" | head -1 | grep -oE '\([0-9A-F-]{36}\)' | tr -d '()')
          
          if [ -z "$SIMULATOR" ]; then
            echo "No iPhone simulator found, using generic destination"
            cd ios && xcodebuild test -workspace TiroScribe.xcworkspace -scheme TiroScribe -destination 'platform=iOS Simulator,name=Any iOS Simulator Device' -only-testing:TiroScribeTests || echo "No Swift unit tests found - skipping"
          else
            echo "Using simulator ID: $SIMULATOR"
            cd ios && xcodebuild test -workspace TiroScribe.xcworkspace -scheme TiroScribe -destination "platform=iOS Simulator,id=$SIMULATOR" -only-testing:TiroScribeTests || echo "No Swift unit tests found - skipping"
          fi

openapi: 3.0.3
info:
  title: Tiro API
  version: 1.0.0
  description: |
    App configuration API used to bootstrap the client (onboarding, model artifacts, etc.).
    - **Onboarding:** clinical attributes (qualifications, therapy methods, languages) for wizard steps.
    - **Model artifacts:** Inference model artifacts (url, hash, size) for on-device download and integrity.

servers:
  - url: /api
    description: Base URL (mutator prepends configured base)

tags:
  - name: tiro
    description: Tiro API – bootstrap (clinical attributes, model artifacts)
  - name: onboarding
    description: Clinical attributes and options for the onboarding flow
  - name: artifacts
    description: Model artifacts for download and integrity

paths:
  /clinical-attributes:
    get:
      tags:
        - tiro
        - onboarding
      operationId: getClinicalAttributes
      summary: Clinical attributes (qualifications, therapy methods, languages)
      description: |
        Returns select options for the onboarding wizard (profile, methods, languages).
        Pass locale to get labels in that language (BCP-47 or tag, e.g. en, fr). Omit for server default.
      parameters:
        - name: locale
          in: query
          required: false
          description: Preferred language for labels (e.g. en, fr). Server returns labels in this locale when supported.
          schema:
            type: string
            example: en
      responses:
        '200':
          description: Clinical attributes for app bootstrap (labels in requested locale when provided)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicalAttributes'
  /artifacts:
    get:
      tags:
        - tiro
        - artifacts
      operationId: getArtifacts
      summary: Model artifacts for download
      description: |
        Returns model artifacts for on-device download. Array of entries; each has use_case and variants. Client looks up by use_case and picks one variant by app/device language when multiple. Used for download, integrity (hash), and progress (size_bytes).
      responses:
        '200':
          description: Array of model artifacts (look up by use_case)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelArtifact'

components:
  schemas:
    ModelArtifactVariant:
      type: object
      description: |
        One model artifact variant for a use_case. When default is true, client must use this variant without searching by app language (language-agnostic). Otherwise (default false) client selects by app language.
      required:
        - language
        - default
        - id
        - version
        - url
        - hash
        - size_bytes
        - min_app_version
      properties:
        language:
          type: string
          description: |
            Primary language tag only (lowercase), or the literal "multilingual".
            Must match the client app locale format: expo-localization is normalized to primary tag (e.g. en, fr) via AppLanguage.
            Use "en", "fr", etc. for language-specific variants; use "multilingual" for language-agnostic model artifacts (VAD, pitch, speaker).
            Do not use region subtags (e.g. prefer "en" not "en-US") to avoid client mismatch.
        default:
          type: boolean
          description: When true, use this variant as-is; do not search by app language. When false, variant is chosen only when app language matches.
        id:
          type: string
        version:
          type: string
        url:
          type: string
          format: uri
        hash:
          type: string
        size_bytes:
          type: integer
        min_app_version:
          type: string
    ModelArtifact:
      type: object
      description: |
        One model artifact entry per use_case. Always has a variants array (one or more). Client picks one variant by app language when needed; single-variant entries (e.g. VAD) have one item in variants.
      required:
        - use_case
        - variants
      properties:
        use_case:
          type: string
          description: Model artifact use case (e.g. speaker_id, vad, asr)
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ModelArtifactVariant'
          minItems: 1
    SelectOption:
      type: object
      required:
        - value
        - label
      properties:
        value:
          type: string
          description: Option value (e.g. code or id)
        label:
          type: string
          description: Display label
    ClinicalAttributes:
      type: object
      required:
        - qualifications
        - therapyMethods
        - languages
      properties:
        qualifications:
          type: array
          items:
            $ref: '#/components/schemas/SelectOption'
        therapyMethods:
          type: array
          items:
            $ref: '#/components/schemas/SelectOption'
        languages:
          type: array
          items:
            $ref: '#/components/schemas/SelectOption'

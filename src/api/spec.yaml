openapi: 3.0.3
info:
  title: Tiro API
  version: 1.0.0
  description: |
    App configuration API used to bootstrap the client (onboarding, inference models, etc.).
    - **Onboarding:** profile attributes (qualifications, therapy methods, languages) for wizard steps.
    - **Inference models:** Model entries (url, hash, size) for on-device download and integrity.

servers:
  - url: /api
    description: Base URL (mutator prepends configured base)

tags:
  - name: profile
    description: Profile attributes and options for the onboarding flow
  - name: inference-models
    description: Inference models for download and integrity

paths:
  /profile-attributes:
    get:
      tags:
        - profile
      operationId: getProfileAttributes
      summary: Profile attributes (qualifications, therapy methods, languages)
      description: |
        Returns select options for the onboarding wizard (profile, methods, languages).
        Pass locale to get labels in that language (BCP-47 or tag, e.g. en, fr). Omit for server default.
      parameters:
        - name: locale
          in: query
          required: false
          description: Preferred language for labels (e.g. en, fr). Server returns labels in this locale when supported.
          schema:
            type: string
            example: en
      responses:
        '200':
          description: Profile attributes for app bootstrap (labels in requested locale when provided)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileAttributes'
  /inference-models:
    get:
      tags:
        - inference-models
      operationId: getInferenceModels
      summary: Inference models for on-device download
      description: |
        Returns inference model entries for on-device download. Array of entries; each has capability and variants. Client looks up by capability and picks one variant by app/device language when multiple. Used for download, integrity (hash), and progress (sizeBytes).
      responses:
        '200':
          description: Array of inference models (look up by capability)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InferenceModel'

components:
  schemas:
    InferenceModelFile:
      type: object
      description: One file (ONNX model, config, tokenizer, etc.) for a variant.
      required:
        - url
        - hash
        - sizeBytes
      properties:
        url:
          type: string
          format: uri
        hash:
          type: string
        sizeBytes:
          type: integer
    InferenceModelVariant:
      type: object
      description: |
        One inference model variant for a capability. When isDefault is true, client must use this variant without searching by app language (language-agnostic). Otherwise (isDefault false) client selects by app language.
        files[0] is the primary file (typically the ONNX model); additional files may be configs, tokenizers, etc.
      required:
        - language
        - isDefault
        - id
        - version
        - files
        - minAppVersion
      properties:
        language:
          type: string
          description: |
            Primary language tag only (lowercase), or the literal "multilingual".
            Must match the client app locale format: expo-localization is normalized to primary tag (e.g. en, fr) via AppLanguage.
            Use "en", "fr", etc. for language-specific variants; use "multilingual" for language-agnostic inference models (VAD, pitch, speaker).
            Do not use region subtags (e.g. prefer "en" not "en-US") to avoid client mismatch.
        isDefault:
          type: boolean
          description: When true, use this variant as-is; do not search by app language. When false, variant is chosen only when app language matches.
        id:
          type: string
        version:
          type: string
        files:
          type: array
          items:
            $ref: '#/components/schemas/InferenceModelFile'
          minItems: 1
          description: Files for this variant (ONNX model, config, tokenizer, etc.). First is primary.
        minAppVersion:
          type: string
    InferenceModel:
      type: object
      description: |
        One inference model entry per capability. Always has a variants array (one or more). Client picks one variant by app language when needed; single-variant entries (e.g. VAD) have one item in variants.
      required:
        - capability
        - variants
      properties:
        capability:
          type: string
          description: Inference model capability (e.g. speaker_id, vad, asr)
        variants:
          type: array
          items:
            $ref: '#/components/schemas/InferenceModelVariant'
          minItems: 1
    LabeledOption:
      type: object
      required:
        - value
        - label
      properties:
        value:
          type: string
          description: Option value (e.g. code or id)
        label:
          type: string
          description: Display label
    ProfileAttributes:
      type: object
      required:
        - qualifications
        - therapyMethods
        - languages
      properties:
        qualifications:
          type: array
          items:
            $ref: '#/components/schemas/LabeledOption'
        therapyMethods:
          type: array
          items:
            $ref: '#/components/schemas/LabeledOption'
        languages:
          type: array
          items:
            $ref: '#/components/schemas/LabeledOption'
